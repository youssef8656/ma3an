<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register for Summer Camp 2026 — MA3AN Camp Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee;
    --ink:#0f3d3e;
    --orange:#f2a022;
    --blue:#2f7bd6;
    --green:#2fa84f;
    --purple:#6c4bd6;
    --red:#e8562f;
    --teal:#1e8e82;
    --card-shadow: 0 20px 40px -18px rgba(15,61,62,0.18);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .heading-font{ font-family:'Baloo 2', sans-serif; }

  /* ============ TOP BAR ============ */
  .topbar{
    position:relative;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 40px 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    font-size:16px;
  }
  .back-link svg{width:20px; height:20px;}
  .back-link:hover{color:var(--teal);}

  .btn-signin-top{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, var(--teal), var(--green));
    color:#fff;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-weight:700;
    font-size:15px;
    font-family:'Nunito', sans-serif;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 10px 20px -8px rgba(30,142,130,0.5);
    transition:transform .15s ease;
  }
  .btn-signin-top:hover{ transform:translateY(-2px); }
  .btn-signin-top svg{ width:16px; height:16px; }

  /* ============ DECORATION ============ */
  .deco-piece{
    position:absolute;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.08));
    z-index:1;
  }
  .dot{ position:absolute; border-radius:50%; }
  .dotgrid{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(5, 10px);
    gap:12px;
  }
  .dotgrid span{
    width:6px; height:6px; border-radius:50%;
    background:rgba(30,142,130,0.28);
  }
  .spark{ position:absolute; }

  @media (prefers-reduced-motion: no-preference){
    .float{ animation:float 6s ease-in-out infinite; }
    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-14px);}
    }
    .spin-slow{ animation:spin 12s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  }

  /* ============ MAIN CONTENT ============ */
  main{
    position:relative;
    z-index:5;
    max-width:760px;
    margin:0 auto;
    padding:6px 20px 100px;
    text-align:center;
  }

  .sun-badge{
    width:64px;
    height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffcf6b, var(--orange));
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px auto 10px;
    box-shadow:0 12px 22px -8px rgba(242,160,34,0.55);
  }
  .sun-badge svg{ width:32px; height:32px; color:#fff; }

  h1.wordmark{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(44px, 8vw, 68px);
    letter-spacing:1px;
    margin:0 0 8px;
    position:relative;
  }
  .wordmark .c1{color:var(--orange);}
  .wordmark .c2{color:var(--blue);}
  .wordmark .c3{color:var(--green);}
  .wordmark .c4{color:var(--purple);}
  .wordmark .c5{color:var(--orange);}

  h2.page-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px, 4vw, 32px);
    color:var(--teal);
    margin:0 0 12px;
  }

  .date-range{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 30px;
  }
  .date-range svg{ width:18px; height:18px; color:var(--ink); }

  form.card{
    background:#fff;
    border-radius:22px;
    box-shadow:var(--card-shadow);
    padding:34px 36px 30px;
    text-align:left;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 24px;
  }

  .field{ margin-bottom:0; }

  label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--teal);
    margin-bottom:8px;
  }
  label .req{ color:var(--red); }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap svg{
    position:absolute;
    left:14px;
    width:19px;
    height:19px;
    color:var(--green);
    pointer-events:none;
  }
  .input-wrap input{
    width:100%;
    padding:13px 14px 13px 44px;
    border-radius:10px;
    border:1.5px solid #b8ddc4;
    background:#fff;
    font-family:'Nunito', sans-serif;
    font-size:15px;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap input::placeholder{ color:#9aa8a8; }
  .input-wrap input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 4px rgba(47,168,79,0.15);
    outline:none;
  }

  .gender-row{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-top:2px;
  }

  .radio-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:1.5px solid #cfd9d8;
    border-radius:10px;
    padding:13px 14px;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    user-select:none;
  }
  .radio-box input{
    width:16px; height:16px;
    accent-color:var(--green);
    margin:0;
  }
  .radio-box:has(input:checked){
    border-color:var(--green);
    background:rgba(47,168,79,0.06);
  }

  .checkbox-row{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    gap:12px;
    margin:6px 0 24px;
  }
  .checkbox-row input{
    width:20px; height:20px;
    accent-color:var(--green);
    cursor:pointer;
  }
  .checkbox-row label{
    margin:0;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }

  .btn-submit{
    grid-column:1 / -1;
    background:var(--green);
    color:#fff;
    border:none;
    padding:17px 20px;
    border-radius:12px;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    box-shadow:0 14px 26px -10px rgba(47,168,79,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-submit svg{ width:20px; height:20px; }
  .btn-submit:hover{ transform:translateY(-2px); }
  .btn-submit:disabled{
    opacity:0.5;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
  }

  .ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height:260px;
    z-index:0;
    pointer-events:none;
  }

  :focus-visible{
    outline:3px solid var(--teal);
    outline-offset:3px;
  }

  @media (max-width:700px){
    .form-grid, .gender-row{ grid-template-columns:1fr; }
    form.card{ padding:26px 20px; }
    .topbar{ padding:20px 20px 0; }
    .deco-piece{ display:none; }
  }
</style>
</head>

  <div class="sun-badge">

<script>
  // Must be logged in (via login.html or signup.html) to reach this step —
  // this is where we save into THEIR existing Users row, not create a new one.
  const _session = window.MA3AN.requireLogin();

  if (_session) {
    document.getElementById('fullname').value = _session.fullName || '';
  }

  const teamCheckbox = document.getElementById('team-activities');
  const submitBtn = document.getElementById('btn-submit');

  function syncSubmitState(){
    submitBtn.disabled = !teamCheckbox.checked;
  }
  teamCheckbox.addEventListener('change', syncSubmitState);
  syncSubmitState();

  document.getElementById('camp-form').addEventListener('submit', async function(e){
    e.preventDefault();
    if (submitBtn.disabled || !_session) return;

    const payload = {
      age: document.getElementById('age').value,
      gender: (document.querySelector('input[name="gender"]:checked') || {}).value || '',
      mobile: document.getElementById('mobile').value,
      parentGuardianName: document.getElementById('guardian').value,
      parentPhone: document.getElementById('guardianphone').value,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const res = await window.MA3AN.updateContact(payload);

    if (!res.success) {
      alert(res.error || 'Could not save your details. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Complete Registration';
      return;
    }

    window.location.href = window.MA3AN_buildUrl('camp-rules.html', { email: _session.email, name: _session.fullName });
  });
</script>
