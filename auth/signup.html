<style>
  :root{
    --cream:#faf6ee;
    --ink:#0f3d3e;
    --orange:#f2a022;
    --blue:#2f7bd6;
    --green:#2fa84f;
    --purple:#6c4bd6;
    --red:#e8562f;
    --teal:#1e8e82;
    --card-shadow: 0 20px 40px -18px rgba(15,61,62,0.18);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  .heading-font{ font-family:'Baloo 2', sans-serif; }

  /* ============ BACK LINK ============ */
  .back-link{
    position:relative;
    z-index:20;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:26px 0 0 40px;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    font-size:16px;
  }
  .back-link svg{width:20px; height:20px;}
  .back-link:hover{color:var(--teal);}

  /* ============ DECORATION ============ */
  .deco-piece{
    position:absolute;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.08));
    z-index:1;
  }
  .dot{
    position:absolute;
    border-radius:50%;
  }
  .dotgrid{
    position:absolute;
    display:grid;
    grid-template-columns:repeat(5, 10px);
    gap:12px;
  }
  .dotgrid span{
    width:6px; height:6px; border-radius:50%;
    background:rgba(30,142,130,0.28);
  }
  .cloud{
    position:absolute;
    opacity:0.5;
  }
  .spark{ position:absolute; }

  @media (prefers-reduced-motion: no-preference){
    .float{ animation:float 6s ease-in-out infinite; }
    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-14px);}
    }
  }

  /* ============ MAIN CONTENT ============ */
  main{
    position:relative;
    z-index:5;
    max-width:640px;
    margin:0 auto;
    padding:20px 20px 100px;
    text-align:center;
  }

  .logo-tile{
    width:190px;
    height:150px;
    margin:0 auto 26px;
    background:#fff;
    border:2px solid var(--orange);
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:var(--card-shadow);
  }
  .logo-tile .wordmark{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:38px;
    letter-spacing:1px;
    margin:0;
  }
  .logo-tile .c1{color:var(--orange);}
  .logo-tile .c2{color:var(--blue);}
  .logo-tile .c3{color:var(--green);}
  .logo-tile .c4{color:var(--purple);}
  .logo-tile .c5{color:var(--orange);}

  h1.page-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(30px, 5vw, 40px);
    color:var(--ink);
    margin:0 0 10px;
  }
  .page-subtitle{
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    opacity:0.75;
    margin:0 0 34px;
  }

  form.card{
    background:#fff;
    border-radius:22px;
    box-shadow:var(--card-shadow);
    padding:36px 40px 34px;
    text-align:left;
  }

  label{
    display:block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
    margin-bottom:10px;
  }

  .field{ margin-bottom:24px; }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap svg{
    position:absolute;
    left:16px;
    width:20px;
    height:20px;
    color:var(--green);
    pointer-events:none;
  }
  .input-wrap input{
    width:100%;
    padding:15px 16px 15px 48px;
    border-radius:12px;
    border:1.5px solid #b8ddc4;
    background:#fff;
    font-family:'Nunito', sans-serif;
    font-size:16px;
    color:var(--ink);
    outline-offset:2px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap input::placeholder{ color:#9aa8a8; }
  .input-wrap input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 4px rgba(47,168,79,0.15);
  }

  .btn-create{
    width:100%;
    background:var(--green);
    color:#fff;
    border:none;
    padding:17px 20px;
    border-radius:12px;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    box-shadow:0 14px 26px -10px rgba(47,168,79,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn-create svg{ width:20px; height:20px; }
  .btn-create:hover{ transform:translateY(-2px); }

  .signin-note{
    text-align:center;
    margin:24px 0 0;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .signin-note a{
    color:var(--purple);
    font-weight:800;
    text-decoration:none;
  }
  .signin-note a:hover{ text-decoration:underline; }

  .ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height:260px;
    z-index:0;
    pointer-events:none;
  }

  :focus-visible{
    outline:3px solid var(--teal);
    outline-offset:3px;
  }

  @media (max-width:640px){
    form.card{ padding:28px 22px; }
    .back-link{ padding:20px 0 0 20px; }
    .deco-piece{ display:none; }
  }
</style>

<script>
  document.getElementById('signup-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const form = this;
    const btn = form.querySelector('.btn-create');
    const errorBox = document.getElementById('signup-error');
    errorBox.style.display = 'none';
    errorBox.textContent = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('full-name').value.trim();

    btn.disabled = true;
    btn.textContent = 'Creating your account…';

    try {
      if (typeof window.MA3AN === 'undefined') {
        throw new Error('ma3an-data.js did not load (check the browser console/network tab for a 404).');
      }

      const res = await window.MA3AN.register({ email, password, fullName });
      console.log('register response:', res);

      if (res && res.success && res.profile && res.profile.email) {
        window.location.href = window.MA3AN_buildUrl('../camp-registration.html', { email: res.profile.email, name: res.profile.fullName });
        return; // leave button disabled — we're navigating away
      }

      throw new Error((res && res.error) || 'Something went wrong. Please try again.');
    } catch (err) {
      console.error('Registration failed:', err);
      btn.disabled = false;
      btn.textContent = 'Create Account';
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
    }
  });
</script>
